obstacle_range: 2.8
raytrace_range: 3.2
footprint: [[0.17, 0.125], [0.17, -0.125], [-0.17, -0.125], [-0.17, 0.125]]
footprint_padding: 0.018
transform_tolerance: 0.35
map_type: costmap

obstacle_layer:
  enabled: true
  obstacle_range: 2.8
  raytrace_range: 3.2
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: lidar_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    expected_update_rate: 0.0
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.18
  cost_scaling_factor: 4.0

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: false
