local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 15.0
  publish_frequency: 6.0
  static_map: false
  rolling_window: true
  width: 2.2
  height: 2.2
  resolution: 0.02
  transform_tolerance: 0.35
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
